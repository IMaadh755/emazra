<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1st-Bite - Admin Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css"> 
    
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-auth-compat.js"></script>
</head>
<body class="app-body">

    <section id="loginSection" class="login-wrapper">
        <div class="card material-card login-card">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3"><i class="fas fa-utensils"></i></div>
                <h2 class="fw-bold">Admin Portal</h2>
                <p class="text-muted small">Sign in to manage 1st-Bite</p>
            </div>
            <div class="alert alert-danger" id="loginError" style="display:none;"></div>
            <form id="loginForm">
                <div class="form-floating mb-3 material-input">
                    <input type="email" class="form-control" id="adminEmail" placeholder="name@example.com" required>
                    <label for="adminEmail">Email address</label>
                </div>
                <div class="form-floating mb-4 material-input">
                    <input type="password" class="form-control" id="adminPassword" placeholder="Password" required>
                    <label for="adminPassword">Password</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">Sign In</button>
            </form>
        </div>
    </section>

    <section id="dashboardSection" style="display:none;" class="app-layout">
        
        <aside class="app-sidebar d-none d-md-flex flex-column shadow-sm">
            <div class="sidebar-brand px-4 py-4">
                <i class="fas fa-utensils me-2 text-primary"></i>
                <span class="fw-bold fs-5">1st-Bite</span>
            </div>
            <ul class="nav flex-column nav-pills px-2 gap-2 admin-tabs" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active w-100 text-start" id="food-tab" data-bs-toggle="tab" data-bs-target="#foodPanel" type="button" role="tab">
                        <i class="bi bi-egg-fried me-2"></i> Foods
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="restaurant-tab" data-bs-toggle="tab" data-bs-target="#restaurantPanel" type="button" role="tab">
                        <i class="bi bi-shop me-2"></i> Restaurants
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="country-tab" data-bs-toggle="tab" data-bs-target="#countryPanel" type="button" role="tab">
                        <i class="bi bi-globe-americas me-2"></i> Countries
                    </button>
                </li>
            </ul>
            <div class="mt-auto p-3" id="logoutNavItem" style="display:none;">
                <a href="index.html" class="btn btn-light w-100 rounded-pill mb-2 text-start"><i class="bi bi-house-door me-2"></i> Live App</a>
                <button id="logoutBtn" class="btn btn-outline-danger w-100 rounded-pill text-start"><i class="bi bi-box-arrow-right me-2"></i> Logout</button>
            </div>
        </aside>

        <main class="app-main">
            <header class="app-bar bg-white shadow-sm px-3 px-md-4 d-flex align-items-center justify-content-between">
                <div>
                    <h1 class="h5 mb-0 fw-bold d-md-none text-primary"><i class="fas fa-utensils me-2"></i>1st-Bite</h1>
                    <h1 class="h5 mb-0 fw-bold d-none d-md-block text-dark">Workspace Overview</h1>
                </div>
            </header>

            <div class="app-content p-3 p-md-4 tab-content">
                
                <div class="tab-pane fade show active" id="foodPanel" role="tabpanel">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                        <div class="search-box-modern flex-grow-1" style="max-width: 400px;">
                            <i class="bi bi-search"></i>
                            <input type="text" placeholder="Search foods..." id="foodSearchInput">
                            <button class="btn btn-link p-0 text-muted" type="button" id="foodClearSearchBtn" style="display:none;"><i class="bi bi-x-circle-fill"></i></button>
                        </div>
                        <button class="btn btn-primary rounded-pill px-4 shadow-sm d-none d-md-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#foodModal" onclick="if(typeof prepareFoodModal === 'function') prepareFoodModal('add')">
                            <i class="fas fa-plus"></i> Add Food
                        </button>
                        <button class="mobile-fab btn btn-primary shadow d-md-none" data-bs-toggle="modal" data-bs-target="#foodModal" onclick="if(typeof prepareFoodModal === 'function') prepareFoodModal('add')">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>

                    <div id="foodListContainer" class="table-responsive material-table-wrapper rounded-4 bg-white shadow-sm border-0"></div>
                </div>

                <div class="tab-pane fade" id="restaurantPanel" role="tabpanel">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                        <div class="search-box-modern flex-grow-1" style="max-width: 400px;">
                            <i class="bi bi-search"></i>
                            <input type="text" placeholder="Search restaurants..." id="restaurantSearchInput">
                            <button class="btn btn-link p-0 text-muted" type="button" id="restaurantClearSearchBtn" style="display:none;"><i class="bi bi-x-circle-fill"></i></button>
                        </div>
                        <button class="btn btn-primary rounded-pill px-4 shadow-sm d-none d-md-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#restaurantModal" onclick="if(typeof prepareRestaurantModal === 'function') prepareRestaurantModal('add')">
                            <i class="fas fa-plus"></i> Add Restaurant
                        </button>
                        <button class="mobile-fab btn btn-primary shadow d-md-none" data-bs-toggle="modal" data-bs-target="#restaurantModal" onclick="if(typeof prepareRestaurantModal === 'function') prepareRestaurantModal('add')">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>

                    <div id="restaurantListContainer" class="table-responsive material-table-wrapper rounded-4 bg-white shadow-sm border-0"></div>
                </div>

                <div class="tab-pane fade" id="countryPanel" role="tabpanel">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                        <div class="search-box-modern flex-grow-1" style="max-width: 400px;">
                            <i class="bi bi-search"></i>
                            <input type="text" placeholder="Search countries..." id="countrySearchInput">
                            <button class="btn btn-link p-0 text-muted" type="button" id="countryClearSearchBtn" style="display:none;"><i class="bi bi-x-circle-fill"></i></button>
                        </div>
                        <button class="btn btn-primary rounded-pill px-4 shadow-sm d-none d-md-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#countryModal" onclick="if(typeof prepareCountryModal === 'function') prepareCountryModal('add')">
                            <i class="fas fa-plus"></i> Add Country
                        </button>
                        <button class="mobile-fab btn btn-primary shadow d-md-none" data-bs-toggle="modal" data-bs-target="#countryModal" onclick="if(typeof prepareCountryModal === 'function') prepareCountryModal('add')">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>

                    <div id="countryListContainer" class="table-responsive material-table-wrapper rounded-4 bg-white shadow-sm border-0"></div>
                </div>

            </div>
        </main>

        <nav class="mobile-bottom-nav d-md-none bg-white shadow-lg border-top">
            <div class="nav flex-row w-100 justify-content-around" role="tablist">
                <button class="nav-link active d-flex flex-column align-items-center p-2" data-bs-toggle="tab" data-bs-target="#foodPanel" type="button" role="tab">
                    <i class="bi bi-egg-fried fs-5 mb-1"></i> <small style="font-size: 0.7rem;">Foods</small>
                </button>
                <button class="nav-link d-flex flex-column align-items-center p-2" data-bs-toggle="tab" data-bs-target="#restaurantPanel" type="button" role="tab">
                    <i class="bi bi-shop fs-5 mb-1"></i> <small style="font-size: 0.7rem;">Places</small>
                </button>
                <button class="nav-link d-flex flex-column align-items-center p-2" data-bs-toggle="tab" data-bs-target="#countryPanel" type="button" role="tab">
                    <i class="bi bi-globe-americas fs-5 mb-1"></i> <small style="font-size: 0.7rem;">Regions</small>
                </button>
                <a href="index.html" class="nav-link d-flex flex-column align-items-center p-2 text-muted text-decoration-none">
                    <i class="bi bi-house-door fs-5 mb-1"></i> <small style="font-size: 0.7rem;">App</small>
                </a>
            </div>
        </nav>
    </section>

    <div class="modal fade material-modal" id="foodModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0">
                <form id="foodForm">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="foodModalTitle">Add New Food</h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="foodId">
                        <div class="form-floating mb-3 material-input">
                            <input type="text" class="form-control" id="foodName" placeholder="Name" required>
                            <label>Food Name</label>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <div class="form-floating material-input">
                                    <input type="number" step="0.01" class="form-control" id="foodPrice" placeholder="Price" required>
                                    <label>Price (QR)</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-floating material-input">
                                    <input type="text" class="form-control" id="foodCategory" placeholder="Category" required>
                                    <label>Category</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3 material-input">
                            <select class="form-select py-3" id="foodRestaurantId" required>
                                <option value="">Select Restaurant</option>
                            </select>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6 material-input">
                                <select class="form-select py-3" id="foodTaste">
                                    <option value="">Taste Rating</option>
                                    <option value="Dissatisfied">Dissatisfied</option>
                                    <option value="Average">Average</option>
                                    <option value="Good">Good</option>
                                    <option value="Excellent">Excellent</option>
                                    <option value="custom">Custom...</option>
                                </select>
                            </div>
                            <div class="col-6 material-input">
                                <select class="form-select py-3" id="foodQuantity">
                                    <option value="">Portion Size</option>
                                    <option value="Dissatisfied">Dissatisfied</option>
                                    <option value="Average">Average</option>
                                    <option value="Good">Good</option>
                                    <option value="Excellent">Excellent</option>
                                    <option value="⚙️ Custom">Custom...</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-floating mb-3 material-input">
                            <input type="url" class="form-control" id="foodImageUrl" placeholder="Image URL">
                            <label>Image URL</label>
                        </div>

                        <div class="form-floating material-input">
                            <textarea class="form-control" id="foodComments" style="height: 100px" placeholder="Comments"></textarea>
                            <label>Comments (Optional)</label>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm" id="foodSubmitBtn">Save Food</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div class="modal fade material-modal" id="restaurantModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0">
                <form id="restaurantForm">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="restaurantModalTitle">Add Restaurant</h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="restaurantId">
                        <div class="form-floating mb-3 material-input">
                            <input type="text" class="form-control" id="restaurantName" placeholder="Name" required>
                            <label>Restaurant Name</label>
                        </div>
                        <div class="form-floating mb-3 material-input">
                            <input type="text" class="form-control" id="restaurantLocation" placeholder="Location" required>
                            <label>City / Location</label>
                        </div>
                        <div class="mb-3 material-input">
                            <select class="form-select py-3" id="restaurantCountryId" required>
                                <option value="">Select Country</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm" id="restaurantSubmitBtn">Save Restaurant</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade material-modal" id="countryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0">
                <form id="countryForm">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="countryModalTitle">Add Country</h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="countryId">
                        <div class="form-floating mb-3 material-input">
                            <input type="text" class="form-control" id="countryName" placeholder="Name" required>
                            <label>Country Name</label>
                        </div>
                        <div class="form-floating mb-3 material-input">
                            <input type="text" class="form-control" id="countryCode" maxlength="2" placeholder="Code" required>
                            <label>2-Letter Code (e.g., qa, lk)</label>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm" id="countrySubmitBtn">Save Country</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
